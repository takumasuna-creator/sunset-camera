<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サンエーBP">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>サンエーBP</title>
<style>
:root{
  --red:#D7141F; --red-ink:#A50E17; --bg:#F4F1F1; --surface:#fff; --line:#E3DCDC; --fg:#1E1A1A; --muted:#6E6464; --ok:#1F8A4C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0}
header small{display:block;font-size:11px;opacity:.85;font-weight:400}
.me{all:unset;cursor:pointer;font-size:12px;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:3px 10px}
main{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 90px);display:grid;gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{all:unset;cursor:pointer;text-align:center;padding:8px 0 10px;font-size:13px;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--red);font-weight:700}
/* 受付 */
.card{background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind{all:unset;cursor:pointer;padding:16px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:16px;display:grid;gap:4px;text-align:center}
.kind small{font-weight:400;font-size:11px;color:var(--muted)}
.kind.wide{grid-column:1/-1;padding:22px 12px;font-size:18px}
.kind[aria-pressed="true"]{border-color:var(--red);background:#FBE7E8}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips .sub{padding:8px 12px;font-size:13px}
#r-shops .sub{padding:10px 4px;font-size:13px}
.sub[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font:inherit;font-size:16px;color:var(--fg);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;min-width:0}
label.f textarea{min-height:64px;resize:vertical}
.req::after{content:" 必須";color:var(--red-ink);font-weight:700}
.done-no{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}

/* 車の一覧 */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--red);border-radius:12px;padding:10px 12px}
.search input{all:unset;flex:1;font-size:17px;min-width:0}
.count{font-size:12px;color:var(--muted)}
.car{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--surface);border-radius:12px;padding:12px 14px}
.no{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.model{font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.cam-ic{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:999px;padding:3px 8px;align-self:start;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 0;font-size:14px}

/* カメラ */
#cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
#cam video{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.cam-top{padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:grid;gap:8px;background:rgba(0,0,0,.55)}
.cam-car{display:flex;align-items:center;gap:10px}
.cam-car b{font-size:16px}
.cam-car span{font-size:12px;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);font-weight:700;font-size:13px;padding:7px 10px}
.cam-btns{display:grid;grid-template-columns:1fr 1fr .7fr;gap:6px}
.cam-btns .done{text-align:center;padding:9px 8px;font-size:14px}
.done{all:unset;cursor:pointer;background:#fff;color:var(--fg);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px}
.stages{display:flex;gap:6px;overflow-x:auto}
.stage{all:unset;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.5)}
.stage[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.stage i{font-style:normal;font-weight:400;opacity:.8;margin-left:3px}
.view{position:relative;min-height:0;overflow:hidden}
.next{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:999px;font-size:15px;font-weight:800}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.7;transition:none}
.cam-err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:15px;line-height:1.6}
.cam-bottom{padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(0,0,0,.55)}
.thumbs{display:flex;gap:4px;min-width:0;overflow:hidden}
.thumbs img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:2px solid transparent;flex:none}
.thumbs img.ok{border-color:var(--ok)}
.thumbs img.ng{border-color:var(--red)}
.shutter{all:unset;cursor:pointer;width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px #fff}
.shutter:active{transform:scale(.94)}
.status{justify-self:end;text-align:right;font-size:12px;line-height:1.5}
.status b{font-size:20px;display:block}

.thumbs img{cursor:pointer}
.thumbs img.hold{border-color:#fff}
/* 横向き: 上の帯は映像に重ね、シャッターは右の縦列に */
@media (orientation: landscape){
  #cam{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) 112px}
  .view{grid-row:1;grid-column:1}
  .cam-top{position:absolute;top:0;left:0;right:112px;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px calc(env(safe-area-inset-left,0px) + 10px);gap:6px;background:rgba(0,0,0,.35)}
  .next{top:auto;bottom:12px}
  .cam-bottom{grid-row:1;grid-column:2;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;justify-items:center;padding:12px calc(env(safe-area-inset-right,0px) + 8px) 12px 8px}
  .cam-bottom .status{order:-1;justify-self:center;text-align:center}
  .cam-bottom .shutter{align-self:center}
  .thumbs{flex-direction:column}
  .thumbs img:nth-child(n+3){display:none}
}
/* 確認画面 */
#review,#peek{position:fixed;inset:0;z-index:25;background:#111;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
.rv-head{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;font-size:15px;font-weight:800}
.rv-head small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.rv-grid{overflow:auto;padding:4px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.rv{position:relative;border-radius:8px;overflow:hidden;background:#333;aspect-ratio:4/3}
.rv img{width:100%;height:100%;object-fit:cover;display:block}
.rv span{position:absolute;left:0;right:0;bottom:0;font-size:11px;background:rgba(0,0,0,.6);padding:2px 5px}
.rv button{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:18px;font-weight:800}
.rv-foot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;gap:8px}
.rv-foot .btn{font-size:17px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:15px;padding:12px}
#peek img,#gview img{width:100%;height:100%;object-fit:contain;min-height:0}
#gal,#gview{position:fixed;inset:0;z-index:26;background:#111;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
#gview{z-index:27}
#gview .rv-foot{grid-template-columns:1fr}
.g-sec{grid-column:1/-1;font-size:13px;font-weight:800;margin-top:8px;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:3px}
.g-sec i{font-style:normal;font-weight:400;opacity:.7;margin-left:4px}
#g-grid{grid-auto-rows:max-content}
#g-grid .rv{aspect-ratio:auto;min-height:max-content}
#g-grid .rv img,#g-grid .rv .pdf{aspect-ratio:4/3;height:auto;position:static}
.rv.doc{background:#f4f4f4;color:#222}
.rv.doc img{object-fit:contain}
.rv .pdf{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--red)}
.g-msg{grid-column:1/-1;text-align:center;opacity:.8;padding:32px 8px;font-size:14px;line-height:1.7}
#peek .rv-foot{grid-template-columns:1fr 1fr}
.sending{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:7;background:var(--fg);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.modal form{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:380px;display:grid;gap:12px}
.modal h2{margin:0;font-size:17px}
.modal input{font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--red);color:#fff;font-weight:800;padding:14px;border-radius:12px;font-size:16px}
.err{color:var(--red-ink);font-size:13px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);background:var(--fg);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
</style>
</head>
<body>
<header id="head">
  <h1>作業<small id="sub">車を押すとカメラが開きます</small></h1><small id="ver" style="font-size:10px;opacity:.7">v18</small>
  <button class="me" id="me">担当者</button>
</header>

<!-- 作業：車を選ぶ -->
<main id="v-list">
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="管理番号・ナンバー・車名・お客様名" autocomplete="off"></label>
  <div class="count" id="count">読み込み中…</div>
  <div id="list" style="display:grid;gap:8px"></div>
</main>

<!-- 受付 -->
<main id="v-recv" hidden>
  <div class="card">
    <h2>どこからの入庫ですか</h2>
    <div class="kinds">
      <button type="button" class="kind" data-k="yUsed" aria-pressed="false">ヤナセ中古車<small>仕入二課</small></button>
      <button type="button" class="kind" data-k="yShop" aria-pressed="false">ヤナセ一般<small>多摩・所沢など</small></button>
      <button type="button" class="kind wide" data-k="general" aria-pressed="false">一般・業者・保険<small>写真→コグニセブン</small></button>
    </div>
  </div>
  <div class="card" id="r-form" hidden>
    <div id="r-yshop" hidden style="display:grid;gap:8px">
      <span class="f"><span>入庫先</span></span>
      <div class="subs" id="r-shops" style="grid-template-columns:1.2fr 1fr .7fr">
        <button type="button" class="sub" aria-pressed="false">ヤナセ多摩支店</button>
        <button type="button" class="sub" aria-pressed="false">ヤナセ所沢</button>
        <button type="button" class="sub" aria-pressed="false">DRP</button>
      </div>
      <input id="r-shop" placeholder="ほかは自由に記入（例: ヤナセ横浜）" style="font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px">
    </div>
    <div id="r-general" hidden style="display:grid;gap:10px">
      <label class="f"><span class="req">入庫先（お客様名・業者名）</span></label>
      <div class="chips" id="r-custs"></div>
      <input id="r-customer" placeholder="ほかは自由に記入（例: 山田 太郎／東京海上）" style="font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px">
      <div class="row2">
        <label class="f"><span>入庫先の区分</span><select id="r-category"></select></label>
        <label class="f"><span>請求先</span><select id="r-bill"></select></label>
      </div>
    </div>
    <label class="f"><span class="req">車名</span><input id="r-car" placeholder="例: C200 AV、プリウス"></label>
    <label class="f"><span class="req">登録番号（なければ車台番号）</span><input id="r-plate" placeholder="例: 所沢330ね1234"></label>
    <div class="row2">
      <label class="f"><span class="req">入庫日</span><input id="r-date" type="date"></label>
      <label class="f"><span>担当</span><input id="r-staff"></label>
    </div>
    <label class="f"><span>作業メモ</span><textarea id="r-memo" placeholder="例: 左リアドア凹み・クォーター擦り傷"></textarea></label>
    <button class="btn" id="r-submit" type="button">受付する</button>
    <div class="err" id="r-err"></div>
  </div>
</main>
<main id="v-done" hidden>
  <div class="card">
    <span class="note">受付しました（売上集計表に記入・写真フォルダー作成済み）</span>
    <span class="done-no" id="d-no"></span>
    <span class="model" id="d-car"></span>
    <span class="note" id="d-where"></span>
  </div>
  <button class="btn" id="d-shoot" type="button">📷 車検証・コーションラベル・メーターから撮る</button>
  <button class="btn ghost" id="d-next" type="button" style="color:var(--fg);border-color:var(--line)">続けて受付する</button>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="recv" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>受付</button>
  <button data-tab="work" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>作業</button>
</nav>

<!-- カメラ（開いたまま、シャッターを押すたびに保存） -->
<div id="cam" hidden>
  <div class="cam-top">
    <div class="cam-car"><b id="c-no"></b><span id="c-car"></span></div>
    <div class="cam-btns"><button class="done ghost" id="c-gal">アップ済み写真</button><label class="done ghost" id="c-roll">写真フォルダー<input type="file" id="roll" accept="image/*" multiple hidden></label><button class="done" id="c-done">終了</button></div>
    <div class="stages" id="stages" hidden></div>
  </div>
  <div class="view">
    <video id="video" playsinline muted autoplay></video>
    <div class="next" id="next"></div>
    <div class="flash" id="flash"></div>
    <div class="cam-err" id="cam-err" hidden></div>
  </div>
  <div class="cam-bottom">
    <div class="thumbs" id="thumbs"></div>
    <button class="shutter" id="shutter" aria-label="撮る"></button>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- 撮った写真の確認（終わる を押した時） -->
<div id="review" hidden>
  <div class="rv-head" id="rv-head"></div>
  <div class="rv-grid" id="rv-grid"></div>
  <div class="rv-foot">
    <button class="btn" id="rv-up" type="button"></button>
    <button class="btn ghost" id="rv-back" type="button">撮影に戻る</button>
    <button class="btn ghost" id="rv-drop" type="button">全部やめる（アップしない）</button>
  </div>
</div>
<!-- 1枚を大きく見る（撮影中にサムネイルを押した時） -->
<div id="peek" hidden>
  <div class="rv-head" id="pk-head"></div>
  <img id="pk-img" alt="">
  <div class="rv-foot">
    <button class="btn ghost" id="pk-back" type="button">戻る</button>
    <button class="btn" id="pk-del" type="button">この写真を削除</button>
  </div>
</div>
<!-- 保存済みの写真・書類（撮影中に「前の写真・書類」を押した時） -->
<div id="gal" hidden>
  <div class="rv-head" id="g-head"></div>
  <div class="rv-grid" id="g-grid"></div>
  <div class="rv-foot">
    <button class="btn ghost" id="g-cogni" type="button" hidden style="background:#fff;color:var(--red);border:0;font-weight:800">⚡ 今すぐコグニセブンへ入れる</button>
    <button class="btn" id="g-back" type="button">撮影に戻る</button>
  </div>
</div>
<div id="gview" hidden>
  <div class="rv-head" id="gv-head"></div>
  <img id="gv-img" alt="">
  <div class="rv-foot"><button class="btn ghost" id="gv-back" type="button">一覧に戻る</button></div>
</div>
<div class="sending" id="sending" hidden></div>

<div class="modal" id="s-pin" hidden><form id="f-pin">
  <h2>PINを入力</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <span class="err" id="pin-err"></span><button class="btn">はじめる</button>
</form></div>
<div class="modal" id="s-me" hidden><form id="f-me">
  <h2>あなたの名前</h2><input id="myname" placeholder="例: 渡邊" autocomplete="off">
  <button class="btn">決定</button>
</form></div>
<div class="toast" id="toast"></div>

<script>
// サンエーBPアプリ（Googleのウェブアプリ）のURL。写真の保存先・車の一覧はここから
const API = 'https://script.google.com/macros/s/AKfycbxFZ3V3-OeyrNbRpultnG4Gbgo7vIO8Dhyouo9MNOcYIdtBDz_1-QDbvLGSzd4jz-Gi/exec';
const STAGES = ['入庫', '分解', '鈑金', '塗装', '完成', 'その他'];
const ANGLES = ['正面', '右前', '右側', '右後', '後ろ', '左後', '左側', '左前'];
// 受付で必ず撮る3枚（保存は「入庫」の写真として送る）
const MUST = ['車検証', 'コーションラベル', 'メーター'];
const CAM_STAGES = ['受付'].concat(STAGES);
const labelFor = (st, n) => st === '受付' ? (MUST[n] || '書類') : st === '入庫' ? (ANGLES[n] || '損傷') : '';
const VERSION = '18';   // 直すたびに上げる。古い画面が残っていたら自動で読み直す
const MAX_KB = 300, MAX_EDGE = 2048, PARALLEL = 5;

const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const norm = s => String(s||'').normalize('NFKC').toUpperCase().replace(/[\s\-‐ー－]/g,'');
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isY = c => c.dest === 'ヤナセBP';   // 振り分けはアプリ側（Y・YY番号とヤナセ昭島・所沢）

let camFirst = '', cars = [], cur = null, stage = '入庫', shots = [], stream = null, running = 0;

// ---------- 起動 ----------
// 送る前の写真はスマホの中（IndexedDB）にも置いておき、アプリを閉じても次に開いた時に続きから送る
const queue = {
  db: null,
  open(){ return this.db || (this.db = new Promise((ok, ng) => {
    const r = indexedDB.open('sunae-upload', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  })); },
  async run(mode, fn){ try { const db = await this.open(); return await new Promise((ok, ng) => {
    const tx = db.transaction('q', mode); const req = fn(tx.objectStore('q'));
    tx.oncomplete = () => ok(req && req.result); tx.onerror = () => ng(tx.error); }); } catch (e) { return null; } },
  put(item){ return this.run('readwrite', st => st.put(item)); },
  del(id){ return this.run('readwrite', st => st.delete(id)); },

async function resumeQueue(){
  const items = await queue.all();
  if (!items || !items.length) return;
  items.filter(it => it.dataUrl).forEach(it => { if (!shots.some(x => x.id === it.id)) shots.push({ id: it.id, no: it.no, car: it.car, stage: it.stage, label: it.label, thumb: it.thumb, dataUrl: it.dataUrl, state: 'wait' }); });
  pump(); showSending();
}

function start(){
  // 配布用リンク（…/#pin=1234）で開いたらPINを覚える
  ['pin', 'me'].forEach(k => { const m = new RegExp('[#&]' + k + '=([^&]+)').exec(location.hash); if (m) store.set(k, decodeURIComponent(m[1])); });
  if (!store.get('pin') && !restored) {   // iPhoneが覚えた内容を消すことがあるので、控え（IndexedDB）から戻す
    restored = true;
    return queue.run('readonly', st => st.get('__me')).then(v => {
      if (v) ['pin', 'me'].forEach(k => { if (v[k] && !store.get(k)) store.set(k, v[k]); });
      start();
    });
  }
  keepMe();
  if (!started) { started = true; resumeQueue(); }
  if (!store.get('pin')) { $('#s-pin').hidden = false; return; }
  if (!store.get('me')) $('#s-me').hidden = false;
  $('#me').textContent = store.get('me') || '担当者';
  loadCars();
}

// ブラウザで開いている間はアドレスの # の後ろにも付けておく（ホーム画面から開いた時は消す）
let restored = false, started = false;
function keepMe(){
  const pin = store.get('pin'), me = store.get('me'); if (!pin) return;
  queue.put({ id: '__me', pin, me });
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  history.replaceState(null, '', location.pathname + location.search
    + (standalone ? '' : '#pin=' + encodeURIComponent(pin) + (me ? '&me=' + encodeURIComponent(me) : '')));
}

$('#roll').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length || !cur) return;
  toast(`${files.length}枚を読み込んでいます…`);
  for (const f of files) {
    try {
      const url = URL.createObjectURL(f);
      const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
      const r = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      const t = document.createElement('canvas'); t.width = 640; t.height = Math.round(640 * cv.height / cv.width);
      t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
      shots.push({ no: cur.no, car: cur, stage: 'その他', label: '', canvas: cv, thumb: t.toDataURL('image/jpeg', .7), state: 'hold' });

// ---------- 過去の写真を速く出す ----------
// ① 一覧はサムネイル無しで先にもらう（サーバーが1枚ずつ縮小するのを待たない）
// ② サムネイルは6枚ずつ・4本同時に後から読み、届いた順に出す
// ③ 一度見たサムネイルと一覧はスマホの中（IndexedDB）に残し、次からは押した瞬間に出す
const cacheDb = {
  db: null,
  open(){ return this.db || (this.db = new Promise((ok, ng) => {
    const r = indexedDB.open('sunae-cache', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('th'); r.result.createObjectStore('list'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  })); },
  async run(name, mode, fn){ try { const db = await this.open(); return await new Promise((ok, ng) => {
    const tx = db.transaction(name, mode); const req = fn(tx.objectStore(name));
    tx.oncomplete = () => ok(req && req.result); tx.onerror = () => ng(tx.error); }); } catch (e) { return null; } },
  get(name, k){ return this.run(name, 'readonly', st => st.get(k)); },
  put(name, k, v){ return this.run(name, 'readwrite', st => st.put(v, k)); },
  async getMany(name, keys){ try { const db = await this.open(); return await new Promise(ok => {
    const out = {}, tx = db.transaction(name, 'readonly'), st = tx.objectStore(name);
    keys.forEach(k => { const q = st.get(k); q.onsuccess = () => { if (q.result) out[k] = q.result; }; });
    tx.oncomplete = () => ok(out); tx.onerror = () => ok(out); }); } catch (e) { return {}; } },
  async trim(){ const n = await this.run('th', 'readonly', st => st.count()); if (n > 3000) await this.run('th', 'readwrite', st => st.clear()); },
};
const thumbs = {};   // id → サムネイル（この起動中）
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let galGen = 0;
function renderGal(){
  const order = ['書類'].concat(STAGES, ['']);
  const html = order.map(st => {
    const items = galList.filter(p => (p.stage || '') === st);
    if (!items.length) return '';
    return `<div class="g-sec">${st || 'その他'}<i>${items.length}</i></div>` + items.map(p => {
      const th = thumbs[p.id] || p.thumb || '';
      return `<div class="rv${p.stage === '書類' ? ' doc' : ''}" data-g="${galList.indexOf(p)}" style="cursor:pointer">`
        + (th ? `<img src="${th}" alt="">` : p.pdf ? `<span class="pdf" data-th="${p.id}">PDF</span>` : `<img src="${BLANK}" data-th="${p.id}" alt="">`)
        + (p.label ? `<span>${esc(p.label)}</span>` : '') + '</div>';
    }).join('');
  }).join('');
  galSeq = order.flatMap(st => galList.filter(p => (p.stage || '') === st && !p.pdf));   // スワイプで送る順（一覧と同じ並び、PDFは除く）
  $('#g-grid').innerHTML = html || '<div class="g-msg">まだ保存された写真・書類はありません。<br>見積書・作業指示書のPDFは、写真ホルダーのこの車のフォルダに入れると、ここに出ます。</div>';
}
function fillThumb(id){
  const el = $('#g-grid').querySelector(`[data-th="${id}"]`); if (!el) return;
  if (el.tagName === 'IMG') { el.src = thumbs[id]; el.removeAttribute('data-th'); }
  else { const im = document.createElement('img'); im.src = thumbs[id]; im.alt = ''; el.replaceWith(im); }
}
async function loadThumbs(gen){
  const need = galList.filter(p => !thumbs[p.id] && !p.thumb).map(p => p.id);
  if (!need.length) return;
  const saved = await cacheDb.getMany('th', need);
  Object.keys(saved).forEach(id => { thumbs[id] = saved[id]; if (gen === galGen) fillThumb(id); });
  const rest = need.filter(id => !thumbs[id]);
  const batches = [];
  for (let i = 0; i < rest.length; i += 6) batches.push(rest.slice(i, i + 6));
  const worker = async () => {
    while (batches.length && gen === galGen) {
      const ids = batches.shift();
      try {
        const r = await (await fetch(API + '?api=thumbs&pin=' + encodeURIComponent(store.get('pin')) + '&ids=' + ids.join(','))).json();
        if (!r.ok) continue;
        Object.keys(r.data || {}).forEach(id => { thumbs[id] = r.data[id]; cacheDb.put('th', id, r.data[id]); if (gen === galGen) fillThumb(id); });
      } catch (e) { return; }   // 古いサーバー（サムネイル窓口なし）でも一覧はそのまま使える
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  cacheDb.trim();
}
async function openGal(){
  const no = cur.no, gen = ++galGen;
  $('#g-head').innerHTML = `${esc(cur.no)}　${esc(cur.car)}<small>保存済みの写真と書類（押すと大きく見られます）</small>`;
  $('#gal').hidden = false;
  $('#g-cogni').hidden = false;
  $('#g-cogni').textContent = urgentLabel(cur);   // ヤナセの車はBPシステム、それ以外はコグニセブン
  // 前に見た一覧があれば、まずそれをすぐ出す（裏で最新に入れ替える）
  const old = await cacheDb.get('list', norm(no));
  if (gen !== galGen) return;
  if (old && old.length) {
    galList = old;
    const saved = await cacheDb.getMany('th', old.map(p => p.id));
    Object.assign(thumbs, saved);
    if (gen !== galGen) return;
    renderGal();
    $('#g-grid').insertAdjacentHTML('afterbegin', '<div class="g-msg" id="g-upd" style="padding:6px">最新を確認中…</div>');
  } else $('#g-grid').innerHTML = '<div class="g-msg">読み込み中…</div>';
  try {
    const r = await (await fetch(API + '?api=photos&lite=1&pin=' + encodeURIComponent(store.get('pin')) + '&no=' + encodeURIComponent(no))).json();
    if (!r.ok) throw new Error(r.error);
    if (gen !== galGen || !cur || cur.no !== no) return;
    r.data.forEach(p => { if (p.thumb) { thumbs[p.id] = p.thumb; cacheDb.put('th', p.id, p.thumb); } });
    galList = r.data.map(p => Object.assign({}, p, { thumb: '' }));
    cacheDb.put('list', norm(no), galList);
    renderGal();
    loadThumbs(gen);
  } catch (err) {
    if (old && old.length) { const u = $('#g-upd'); if (u) u.textContent = '最新を読めませんでした（前に見た分を表示中）'; }
    else $('#g-grid').innerHTML = `<div class="g-msg">読み込めませんでした: ${esc(err.message || err)}</div>`;
  }
}
$('#g-back').onclick = () => { $('#gal').hidden = true; galGen++; };
// 至急: PCのコグニ自動取り込みに「この車を最優先で」と頼む。
// 車フォルダーに「至急コグニ」という小さな依頼カードの画像を送ると、PCの常駐がそれを見つけて
// この車の写真をすぐ見積へ入れ、依頼カードは消す（GASの変更なしで動く仕組み）
const urgentLabel = c => isY(c) ? '⚡ 今すぐヤナセBPシステムへ上げる' : '⚡ 今すぐコグニセブンへ入れる';
$('#g-cogni').onclick = async () => {
  const c = cur; if (!c) return;
  const bp = isY(c), dest = bp ? 'ヤナセBPシステム' : 'コグニセブン';
  const b = $('#g-cogni'); b.disabled = true; b.textContent = '依頼しています…';
  try {
    const cv = document.createElement('canvas'); cv.width = 480; cv.height = 160;
    const g = cv.getContext('2d');
    g.fillStyle = '#D7141F'; g.fillRect(0, 0, 480, 160);
    g.fillStyle = '#fff'; g.font = 'bold 34px sans-serif'; g.fillText(bp ? '至急BP依頼' : '至急コグニ依頼', 24, 62);
    g.font = '22px sans-serif';
    g.fillText(`${c.no}  ${c.car || ''}`.slice(0, 30), 24, 104);
    g.fillText(new Date().toLocaleString('ja-JP') + '  ' + (store.get('me') || ''), 24, 138);
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ pin: store.get('pin'), no: c.no, customer: c.customer, car: c.car, plate: c.plate,
        stage: 'その他', label: bp ? '至急BP' : '至急コグニ', staff: store.get('me'), dataUrl: cv.toDataURL('image/jpeg', .8) }) });
    const r = await res.json();
    if (!r.ok) throw new Error(r.error);
    toast(`PCに頼みました。数分で${dest}に入ります`);
    b.textContent = '✓ 依頼しました（数分で入ります）';
    setTimeout(() => { b.disabled = false; b.textContent = urgentLabel(c); }, 60000);
  } catch (err) {
    toast('依頼できませんでした: ' + (err.message || err));
    b.disabled = false; b.textContent = urgentLabel(c);
  }
};
$('#g-grid').onclick = async e => {
  const b = e.target.closest('[data-g]'); if (!b) return;
  const p = galList[+b.dataset.g];
  const url = API + '?api=photo&pin=' + encodeURIComponent(store.get('pin')) + '&id=' + encodeURIComponent(p.id);
  if (p.pdf) {   // PDFは別の画面で開く（iPhoneのPDF表示でページ送り・拡大ができる）
    const w = window.open('', '_blank');
    toast('書類を開いています…');
    try {
      const r = await (await fetch(url)).json();
      if (!r.ok) throw new Error(r.error);
      const blob = await (await fetch(r.data)).blob();
      const href = URL.createObjectURL(blob);
      if (w) w.location.href = href; else location.assign(href);
    } catch (err) { if (w) w.close(); toast('開けませんでした: ' + (err.message || err)); }
    return;
  }
  showBig(galSeq.indexOf(p));
};
function bigUrl(p){ return API + '?api=photo&pin=' + encodeURIComponent(store.get('pin')) + '&id=' + encodeURIComponent(p.id); }
async function loadBig(p){
  if (!bigCache[p.id]) bigCache[p.id] = fetch(bigUrl(p)).then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; })
    .catch(err => { delete bigCache[p.id]; throw err; });
  return bigCache[p.id];
}
async function showBig(i){
  const p = galSeq[i]; if (!p) return;
  galAt = i;
  $('#gv-head').innerHTML = `${esc(p.stage || 'その他')}${p.label ? '・' + esc(p.label) : ''}<small>${i + 1} / ${galSeq.length}　左右にスワイプで前後の写真</small>`;
  $('#gv-img').src = thumbs[p.id] || p.thumb || '';
  $('#gview').hidden = false;
  try { const d = await loadBig(p); if (galAt === i && !$('#gview').hidden) $('#gv-img').src = d; }
  catch (err) { toast('大きい画像を読み込めませんでした'); }
  [i + 1, i - 1].forEach(j => { if (galSeq[j]) loadBig(galSeq[j]).catch(() => {}); });   // 前後を先に読んでおく
}
$('#gv-back').onclick = () => { $('#gview').hidden = true; $('#gv-img').src = ''; galAt = -1; };
// 左右スワイプで前後の写真（画面の左右端をタップしても送れる）
let sx = null, sy = 0;
$('#gv-img').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#gv-img').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
});
$('#gv-img').addEventListener('click', e => { const w = e.currentTarget.clientWidth; if (e.offsetX < w * .25) step(-1); else if (e.offsetX > w * .75) step(1); });
function step(d){
  const j = galAt + d;
  if (j < 0 || j >= galSeq.length) { toast(d > 0 ? '最後の写真です' : '最初の写真です'); return; }
  showBig(j);
}

function showSending(){
  const left = shots.filter(s => s.state === 'wait' || s.state === 'up').length;
  const err = shots.filter(s => s.state === 'err').length;
  $('#sending').hidden = !left && !err;
  $('#sending').textContent = left ? `写真を送っています（残り${left}枚）。次の車を撮っても大丈夫です`
    : `${err}枚まだ送れていません。電波が戻ると自動で送ります（押すと今すぐ送り直し）`;
}
$('#sending').onclick = () => { shots.forEach(s => { if (s.state === 'err') s.state = 'wait'; }); pump(); showSending(); };

const mine = () => shots.filter(s => cur && s.no === cur.no);
function renderCam(){
  const here = mine();
  const n = st => here.filter(s => s.stage === st).length;
  $('#stages').innerHTML = CAM_STAGES.map(s => `<button class="stage" data-s="${s}" aria-pressed="${s === stage}">${s}<i>${n(s)}</i></button>`).join('');
  const k = held().filter(s => s.stage === stage).length;
  $('#next').textContent = stage === '受付' && k < MUST.length || stage === '入庫' && k < 8 ? `次: ${labelFor(stage, k)}` : '';
  $('#next').hidden = !$('#next').textContent;
  $('#thumbs').innerHTML = here.slice(-4).reverse().map(s => `<img src="${s.thumb}" data-k="${shots.indexOf(s)}" class="${s.state === 'hold' ? 'hold' : s.state === 'done' ? 'ok' : s.state === 'err' ? 'ng' : ''}" alt="">`).join('');
  $('#status').innerHTML = `<b>${held().length}枚</b>未アップ`;
}
$('#stages').onclick = e => { const b = e.target.closest('.stage'); if (!b) return; stage = b.dataset.s; renderCam(); };

$('#shutter').onclick = () => {
  const v = $('#video');
  if (!cur || !v.videoWidth) return;
  const s = Math.min(1, MAX_EDGE / Math.max(v.videoWidth, v.videoHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  const label = labelFor(stage, held().filter(x => x.stage === stage).length);
  const t = document.createElement('canvas'); t.width = 640; t.height = Math.round(640 * cv.height / cv.width);   // 確認用
  t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
  shots.push({ no: cur.no, car: cur, stage, label, canvas: cv, thumb: t.toDataURL('image/jpeg', .7), state: 'hold' });
  const f = $('#flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  if (navigator.vibrate) navigator.vibrate(30);
  // 受付の3枚を撮り終えたら、そのまま入庫の8方向へ進む
  if (stage === '受付' && held().filter(x => x.stage === '受付').length === MUST.length) { stage = '入庫'; toast('車検証・コーションラベル・メーターOK。続けて車の周りを撮ってください'); }
  renderCam();
};

// ---------- 送信（JPEG・300KB以下、5枚ずつ） ----------
function pump(){
  while (running < PARALLEL && shots.some(s => s.state === 'wait')) { running++; worker().finally(() => running--); }
}
async function worker(){
  let s;
  while ((s = shots.find(x => x.state === 'wait'))) {
    s.state = 'up';
    try {
      const c = s.car;
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pin: store.get('pin'), no: c.no, customer: c.customer, car: c.car, plate: c.plate,
          stage: s.stage === '受付' ? '入庫' : s.stage, label: s.label, staff: store.get('me'), dataUrl: s.dataUrl }) });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error);
      s.state = 'done'; s.dataUrl = null;
      queue.del(s.id);
    } catch (err) {
      s.state = 'err';
      clearTimeout(retryT); retryT = setTimeout(retryErr, 15000);   // 電波が悪い時は少し待って自動で送り直す
    }
    if (cur) renderCam();
    showSending();
  }
}
let retryT;
function retryErr(){ if (!shots.some(s => s.state === 'err')) return; shots.forEach(s => { if (s.state === 'err') s.state = 'wait'; }); pump(); showSending(); }
window.addEventListener('online', retryErr);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') retryErr(); });
function toJpeg(cv){
  const limit = MAX_KB * 1024 * 1.37;
  let c = cv;
  for (let round = 0; round < 6; round++) {
    for (const q of [0.85, 0.75, 0.65, 0.55]) {
      const d = c.toDataURL('image/jpeg', q);
      if (d.length - 23 <= limit) return d;
    }
    const n = document.createElement('canvas');
    n.width = Math.round(c.width * .8); n.height = Math.round(c.height * .8);
    n.getContext('2d').drawImage(c, 0, 0, n.width, n.height); c = n;
  }
  return c.toDataURL('image/jpeg', 0.5);
}

let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3200); }
window.addEventListener('beforeunload', e => { if (shots.some(s => s.state === 'hold')) { e.preventDefault(); e.returnValue = ''; } });

// iPhoneが古い画面を覚えていることがあるので、開くたびに新しい版が出ていないか確かめる
fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const m = /const VERSION = '(\d+)'/.exec(t);
  if (m && m[1] !== VERSION) location.replace(location.pathname + '?v=' + m[1] + location.hash);
}).catch(() => {});
start();
</script>
