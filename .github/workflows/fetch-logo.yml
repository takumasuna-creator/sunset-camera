name: fetch-logo
on:
  push:
    paths: ['.github/workflows/fetch-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logo-src
          T='https://sun-acar.com/wp-content/themes/%E3%82%B5%E3%83%B3%E3%82%A8%E3%83%BC%E8%87%AA%E5%8B%95%E8%BB%8A/assets/img'
          curl -fsSL -o logo-src/favicon.png https://sun-acar.com/wp-content/uploads/2025/05/cropped-favicon2-270x270.png || true
          curl -fsSL -o logo-src/logo.webp "$T/logo.webp" || true
          curl -fsSL -o logo-src/footer_logo.webp "$T/footer_logo.webp" || true
          ls -la logo-src
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add logo-src
          git commit -m "サイトのロゴを取得" || exit 0
          git push
